<style>
:root {
  /* BGC brand: red #E30613 / black #141414 / white */
  --primary: #E30613;
  --primary-h: #C9111A;
  --bg: #0C0C0C;
  --panel: #141414;
  --panel-2: #1D1D1D;
  --panel-3: #262626;
  --border: #2C2C2C;
  --text: #F5F5F5;
  --muted: #A1A1A1;
  --success: #22C55E;
  --warning: #F59E0B;
  --danger: #E30613;
  --shadow: 0 6px 24px rgba(0,0,0,.5);
  --f-body: 'Inter','Cairo','Segoe UI',Tahoma,Arial,sans-serif;
  --f-head: 'Barlow Condensed','Cairo','Segoe UI',Tahoma,Arial,sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--f-body); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
h1,h2,h3,.kpi-value,.card-title { font-family: var(--f-head); }

/* Header */
.app-header { background: var(--panel); padding: 12px 28px 12px 130px; border-bottom: 3px solid var(--primary); display: flex; align-items: center; justify-content: space-between; gap: 16px; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; overflow: hidden; flex-wrap: wrap; }
.app-header::before { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 110px; background: var(--primary); clip-path: polygon(0 0, 72% 0, 30% 100%, 0 100%); }
.brand { display: flex; align-items: center; gap: 16px; }
.brand img { height: 42px; width: auto; display: block; }
.brand-sep { width: 1px; height: 34px; background: var(--border); }
.brand-text h1 { font-size: 22px; font-weight: 700; letter-spacing: .3px; line-height: 1.2; }
.brand-text p { font-size: 12px; color: var(--muted); font-family: var(--f-body); letter-spacing: .6px; }
.header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; position: relative; }
.clock { font-size: 12px; color: var(--muted); background: var(--panel-2); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); }

/* Tabs */
.nav-tabs { background: var(--panel); padding: 0 28px; display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.nav-tab { padding: 14px 22px; background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit; border-bottom: 3px solid transparent; transition: all .2s; white-space: nowrap; }
.nav-tab:hover { color: var(--text); background: var(--panel-2); }
.nav-tab.active { color: #fff; border-bottom-color: var(--primary); background: var(--panel-2); }

main { padding: 28px; max-width: 1600px; margin: 0 auto; }
.page { display: none; }
.page.active { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page-title { font-size: 26px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
.page-title .badge { font-family: var(--f-body); font-size: 12px; padding: 3px 10px; background: var(--primary); color: #fff; border-radius: 12px; font-weight: 600; }

/* KPI */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi-card { background: var(--panel); padding: 18px 20px; border-radius: 10px; border: 1px solid var(--border); position: relative; overflow: hidden; transition: transform .2s, border-color .2s; }
.kpi-card.link { cursor: pointer; }
.kpi-card.link:hover { transform: translateY(-3px); border-color: var(--primary); }
.kpi-card::before { content: ''; position: absolute; top: 0; right: 0; left: 0; height: 4px; background: #555; }
.kpi-card.red::before { background: var(--primary); }
.kpi-card.success::before { background: var(--success); }
.kpi-card.warning::before { background: var(--warning); }
.kpi-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.kpi-value { font-size: 40px; font-weight: 700; line-height: 1.1; margin-bottom: 4px; }
.kpi-sub { font-size: 12px; color: var(--muted); }
.kpi-icon { position: absolute; top: 16px; left: 16px; width: 38px; height: 38px; background: var(--panel-2); border-radius: 8px; display: grid; place-items: center; font-size: 18px; }

/* Cards */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
.card-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; margin-left: 4px; }
.card-title > span:first-child { flex: 1; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } .app-header { padding-left: 28px; } .app-header::before { width: 50px; } }

/* Buttons */
.btn { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; transition: all .2s; }
.btn:hover { background: var(--primary-h); transform: translateY(-1px); }
.btn-success { background: #16A34A; } .btn-success:hover { background: #15803D; }
.btn-secondary { background: var(--panel-3); border: 1px solid var(--border); } .btn-secondary:hover { background: #333; }
.btn-outline-danger { background: transparent; border: 1px solid var(--primary); color: #ff6b72; } .btn-outline-danger:hover { background: rgba(238,24,34,.15); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* Forms */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 13px; color: var(--muted); font-weight: 600; }
.form-label .req { color: var(--primary); }
input, select, textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border-color .2s, box-shadow .2s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(238,24,34,.18); }
input:disabled { opacity: .5; cursor: not-allowed; }
textarea { resize: vertical; min-height: 80px; }
.form-info { background: var(--panel-2); border: 1px solid var(--border); border-right: 3px solid var(--primary); border-radius: 8px; padding: 12px; font-size: 13px; color: var(--muted); margin-top: 12px; }
.form-info strong { color: var(--text); }

/* Tables */
.table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.table-toolbar { padding: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--panel-2); border-bottom: 1px solid var(--border); }
.table-toolbar input, .table-toolbar select { font-size: 13px; padding: 8px 10px; min-width: 150px; }
.table-scroll { max-height: 640px; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: var(--panel-3); padding: 12px 10px; text-align: right; font-weight: 700; position: sticky; top: 0; border-bottom: 2px solid var(--primary); z-index: 1; white-space: nowrap; }
tbody td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr:hover { background: var(--panel-2); }
tbody tr.fault { background: rgba(238,24,34,.08); }
tbody tr.maintenance { background: rgba(245,158,11,.08); }
code.cd { background: var(--panel-3); padding: 2px 6px; border-radius: 4px; font-size: 11px; direction: ltr; display: inline-block; }
.nowrap { white-space: nowrap; }

/* Badges & inline status select */
.badge-status { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; display: inline-block; }
.badge-status.ok, .badge-status.done { background: rgba(34,197,94,.16); color: #4ADE80; }
.badge-status.fault { background: rgba(238,24,34,.18); color: #FF6B72; }
.badge-status.maint, .badge-status.hold { background: rgba(245,158,11,.16); color: #FBBF24; }
.badge-status.progress { background: rgba(255,255,255,.10); color: #E5E5E5; }
.st-select { padding: 4px 8px; font-size: 12px; font-weight: 600; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
.st-select.done { background: rgba(34,197,94,.16); color: #4ADE80; }
.st-select.hold { background: rgba(245,158,11,.16); color: #FBBF24; }
.st-select.progress { background: rgba(255,255,255,.10); color: #E5E5E5; }
.st-select option { background: var(--panel); color: var(--text); }

/* Toast */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--panel); border: 1px solid var(--border); border-right: 4px solid var(--primary); padding: 14px 20px; border-radius: 8px; box-shadow: var(--shadow); z-index: 1000; animation: slideIn .3s ease; max-width: 380px; }
.toast.success { border-right-color: var(--success); }
.toast.error { border-right-color: var(--primary); }
@keyframes slideIn { from { transform: translateX(120%); } to { transform: none; } }

.chart-box { position: relative; height: 280px; }
.chart-fallback { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 13px; text-align: center; }

/* Modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 500; }
.modal-backdrop.open { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border); border-top: 4px solid var(--primary); border-radius: 12px; width: min(760px, 94vw); max-height: 92vh; overflow: auto; padding: 24px; }
.modal h3 { margin-bottom: 16px; font-size: 22px; }
.modal-foot { margin-top: 18px; display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.modal-foot .grp { display: flex; gap: 8px; flex-wrap: wrap; }
.detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; gap: 16px; }
.detail-row:last-child { border-bottom: none; }
.detail-row .label { color: var(--muted); }
.detail-row .value { font-weight: 600; text-align: left; }
.tl { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
.tl h4 { font-size: 14px; margin-bottom: 10px; color: var(--muted); }
.tl-item { display: flex; gap: 12px; padding: 7px 0; font-size: 13px; border-bottom: 1px dashed var(--border); }
.tl-item time { color: var(--muted); font-size: 11px; white-space: nowrap; min-width: 120px; }
.link-li { cursor: pointer; color: #ff8a90; } .link-li:hover { text-decoration: underline; }

.empty-state { text-align: center; padding: 40px; color: var(--muted); }
.empty-state .icon { font-size: 44px; margin-bottom: 10px; opacity: .4; }
.stats-row { display: flex; gap: 20px; flex-wrap: wrap; padding: 10px 14px; font-size: 13px; }
.stats-row span { color: var(--muted); } .stats-row strong { color: var(--text); }
.open-item { padding: 10px 4px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.open-item small { color: var(--muted); }
.open-item .act { display: flex; gap: 6px; align-items: center; }

.app-footer { text-align: center; padding: 22px 16px 30px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); margin-top: 10px; }
.app-footer .tag { font-family: var(--f-head); font-size: 17px; letter-spacing: .8px; color: var(--text); margin-bottom: 4px; direction: ltr; }
.app-footer .tag b { color: var(--primary); font-weight: 700; }

@media print {
  .nav-tabs, .app-header, .table-toolbar, .btn, .app-footer, .st-select { display: none !important; }
  body { background: #fff; color: #000; }
  .card, .table-wrap { background: #fff; border: 1px solid #ccc; }
  thead th { background: #eee; color: #000; }
}
</style>
</head>
