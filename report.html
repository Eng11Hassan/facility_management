<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تسجيل بلاغ صيانة — BGC</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <style>
        :root { --red: #E30613; --black: #111; --bg: #f4f5f7; --line: #ddd; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); font-family: Cairo, sans-serif; color: #222; }
        .top { background: #111; color: #fff; padding: 22px max(20px, calc((100% - 900px)/2)); border-bottom: 5px solid var(--red); }
        .top b { font-size: 24px; }
        .top span { color: #bbb; }
        .wrap { max-width: 900px; margin: 28px auto; padding: 0 16px; }
        .card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: 0 8px 25px #0000000b; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .full { grid-column: 1/-1; }
        label { font-weight: 700; font-size: 14px; }
        input, select, textarea { font: inherit; padding: 11px; border: 1px solid #cfd2d7; border-radius: 8px; background: white; width: 100%; }
        textarea { min-height: 115px; resize: vertical; }
        .btn { background: var(--red); color: white; border: 0; border-radius: 8px; padding: 12px 20px; font: 700 15px Cairo; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn:disabled { opacity: .6; cursor: wait; }
        .note { padding: 12px; background: #fff5f5; border-right: 4px solid var(--red); border-radius: 6px; margin-bottom: 18px; font-size: 14px; }
        .msg { margin-top: 14px; font-weight: 700; text-align: center; }
        @media(max-width: 620px) { .grid { grid-template-columns: 1fr; } .full { grid-column: auto; } .card { padding: 16px; } }
    </style>
</head>
<body>
    <header class="top"><b>BGC</b> <span>AlBassem General Contracting · تسجيل بلاغ صيانة</span></header>
    <main class="wrap">
        <div class="card">
            <h1 style="margin-top:0; font-size: 20px;">تسجيل عطل أو طلب صيانة</h1>
            <div class="note">اختر الشقة أولاً، ثم الغرفة، ثم اختر الأصل المطلوب بدقة.</div>
            
            <form id="reportForm">
                <div class="grid">
                    <!-- 1. اختيار الشقة / الموقع -->
                    <div class="field">
                        <label for="apartmentSelect">1. الشقة / الموقع *</label>
                        <select id="apartmentSelect" required>
                            <option value="">— اختر الشقة أولاً —</option>
                        </select>
                    </div>

                    <!-- 2. اختيار الغرفة / الإدارة -->
                    <div class="field">
                        <label for="officeSelect">2. الغرفة / الإدارة *</label>
                        <select id="officeSelect" required disabled>
                            <option value="">— اختر الشقة أولاً —</option>
                        </select>
                    </div>

                    <!-- 3. اختيار الأصل -->
                    <div class="field full">
                        <label for="assetSelect">3. الأصل المطلوب صيانته *</label>
                        <select id="assetSelect" required disabled style="border: 2px solid var(--red); font-weight: bold;">
                            <option value="">— اختر الغرفة أولاً —</option>
                        </select>
                    </div>

                    <!-- حقول مخفية للربط والحفظ -->
                    <input type="hidden" id="asset_code">
                    <input type="hidden" id="asset_name">
                    <input type="hidden" id="apartment">
                    <input type="hidden" id="office">

                    <div class="field">
                        <label for="category">التصنيف</label>
                        <select id="category">
                            <option>كهرباء</option><option>تكييف</option><option>سباكة</option><option>أثاث</option><option>أمان وإنذار</option><option>أجهزة أخرى</option><option>أخرى</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="type">نوع الطلب *</label>
                        <select id="type">
                            <option>عطل</option><option>صيانة وقائية</option><option>طلب خدمة</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="reporter">اسم مقدم البلاغ *</label>
                        <input id="reporter" required placeholder="اكتب اسمك">
                    </div>
                    <div class="field">
                        <label for="date">تاريخ البلاغ</label>
                        <input id="date" type="date" required>
                    </div>

                    <div class="field full">
                        <label for="description">وصف المشكلة أو المطلوب *</label>
                        <textarea id="description" required placeholder="اشرح العطل أو التفاصيل..."></textarea>
                    </div>
                </div>

                <button class="btn" id="submitBtn" type="submit">إرسال البلاغ إلى لوحة التحكم</button>
                <div id="message" class="msg" role="status"></div>
            </form>
        </div>
    </main>
