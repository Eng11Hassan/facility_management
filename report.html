<body><header class="top"><b>BGC</b> <span>AlBassem General Contracting · تسجيل بلاغ</span></header><main class="wrap"><div class="card"><h1 style="margin-top:0">تسجيل عطل أو طلب صيانة</h1><div class="note">اختر الأصل من القائمة — سيتم تعبئة الموقع والغرفة والاسم تلقائياً.</div>
<form id="reportForm"><div class="grid">

<div class="field full">
    <label for="assetSelect">الأصل (اختر من القائمة) *</label>
    <select id="assetSelect" required>
        <option value="">— اختر الأصل —</option>
    </select>
</div>

<!-- حقول مخفية لحفظ البيانات بالبنية المطلوبة -->
<div class="field" style="display:none;"><input id="asset_code"></div>
<div class="field" style="display:none;"><input id="asset_name"></div>

<div class="field"><label for="apartment">المبنى / الموقع *</label><input id="apartment" required placeholder="الموقع أو الشقة"></div>
<div class="field"><label for="office">الغرفة / الإدارة</label><input id="office" placeholder="مكان الأصل"></div>
<div class="field"><label for="category">التصنيف</label><select id="category"><option>كهرباء</option><option>تكييف</option><option>سباكة</option><option>أثاث</option><option>أمان وإنذار</option><option>أجهزة أخرى</option><option>أخرى</option></select></div>
<div class="field"><label for="type">نوع الطلب *</label><select id="type"><option>عطل</option><option>صيانة وقائية</option><option>طلب خدمة</option></select></div>
<div class="field"><label for="priority">الأولوية</label><select id="priority"><option>عادية</option><option>متوسطة</option><option>عالية</option><option>حرجة</option></select></div>
<div class="field"><label for="reporter">اسم مقدم البلاغ *</label><input id="reporter" required></div>
<div class="field"><label for="contact">رقم التواصل (اختياري)</label><input id="contact" type="tel"></div>
<div class="field"><label for="date">تاريخ البلاغ</label><input id="date" type="date" required></div>
<div class="field full"><label for="description">وصف المشكلة أو المطلوب *</label><textarea id="description" required placeholder="اشرح العطل ومكانه وأي تفاصيل تساعد فريق الصيانة"></textarea></div>
</div><p class="small">لا تضع بيانات شخصية حساسة أو كلمات مرور في وصف البلاغ.</p><button class="btn" id="submitBtn" type="submit">إرسال البلاغ</button><div id="message" class="msg" role="status"></div></form>

const $=id=>document.getElementById(id); 
$('date').value=new Date().toISOString().slice(0,10);

const configured=window.BGC_SUPABASE_URL&&!window.BGC_SUPABASE_URL.includes('PASTE_')&&window.BGC_SUPABASE_ANON_KEY&&!window.BGC_SUPABASE_ANON_KEY.includes('PASTE_')&&window.supabase;
const db=configured?window.supabase.createClient(window.BGC_SUPABASE_URL,window.BGC_SUPABASE_ANON_KEY):null;

let allAssets = [...EMBEDDED_ASSETS];

async function loadAssetsDropdown() {
    try {
        if (db) {
            const { data, error } = await db.from('bgc_app_state').select('payload').eq('id', 1).maybeSingle();
            if (!error && data?.payload) {
                const payload = data.payload;
                if (Array.isArray(payload.customAssets) && payload.customAssets.length > 0) {
                    const embeddedCodes = new Set(EMBEDDED_ASSETS.map(a => a.code));
                    const merged = [...EMBEDDED_ASSETS];
                    payload.customAssets.forEach(a => { if (!embeddedCodes.has(a.code)) merged.push(a); });
                    allAssets = merged;
                }
            }
        }
    } catch (err) {
        console.error('خطأ في جلب الأصول من قاعدة البيانات، سيتم استخدام القائمة المدمجة:', err);
    }

    const select = $('assetSelect');
    select.innerHTML = '<option value="">— اختر الأصل —</option>';
    
    allAssets.forEach(asset => {
        const code = asset.code || '';
        const apartment = asset.apartment || '';
        const office = asset.office || '';
        const name = asset.name || '';
        
        // التنسيق المطلوب تماماً: الكود — الموقع (الغرفة) — اسم الأصل
        const displayText = `${code} — ${apartment} (${office}) — ${name}`;
        
        const opt = document.createElement('option');
        opt.value = code;
        opt.textContent = displayText;
        opt.dataset.code = code;
        opt.dataset.name = name;
        opt.dataset.apartment = apartment;
        opt.dataset.office = office;
        select.appendChild(opt);
    });
}

// عند اختيار أصل من القائمة المنسدلة يتم تعبئة الحقول تلقائياً
\$('assetSelect').addEventListener('change', (e) => {
    const selectedCode = e.target.value;
    const selectedOption = e.target.selectedOptions[0];
    
    if (selectedOption && selectedOption.dataset.code) {
        \$('asset_code').value = selectedOption.dataset.code;
        \$('asset_name').value = selectedOption.dataset.name;
        \$('apartment').value = selectedOption.dataset.apartment;
        \$('office').value = selectedOption.dataset.office;
    } else {
        $('asset_code').value = '';$('asset_name').value = '';
        $('apartment').value = '';$('office').value = '';
    }
});

window.addEventListener('DOMContentLoaded', loadAssetsDropdown);

\$('reportForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('submitBtn'), msg =$('message');
    btn.disabled = true;
    msg.textContent = '';
    
    const v = id => \$(id).value.trim();
    const selectedCode = v('asset_code') || \$('assetSelect').value;
    const selectedAssetObj = allAssets.find(a => a.code === selectedCode);
    const finalAssetName = selectedAssetObj ? selectedAssetObj.name : (v('asset_name') || 'أصل عام');

    const ticket = {
        ticket_no: 'TKT-' + Date.now().toString().slice(-8),
        date: v('date'),
        asset_code: selectedCode,
        asset_name: finalAssetName,
        apartment: v('apartment'),
        office: v('office'),
        category: v('category'),
        type: v('type'),
        priority: v('priority'),
        description: v('description'),
        reporter: v('reporter'),
        contact: v('contact'),
        technician: 'غير محدد',
        status: 'جديد',
        resolution_date: null,
        parts: '',
        cost: 0,
        duration: 0,
        history: [{ at: new Date().toISOString(), text: 'تم تسجيل البلاغ من صفحة البلاغات المستقلة' }]
    };

    try {
        if (!db) throw new Error('لم يتم إعداد الاتصال بقاعدة البيانات بعد.');
        const { data, error } = await db.from('bgc_app_state').select('payload').eq('id', 1).maybeSingle();
        if (error) throw error;
        
        const p = data?.payload || { tickets: [], seq: 0, customAssets: [] };
        p.tickets = Array.isArray(p.tickets) ? p.tickets : [];
        p.tickets.push(ticket);
        p.seq = Math.max(Number(p.seq) || 0, parseInt(ticket.ticket_no.replace(/\D/g, '')) || 0);
        
        const { error: saveError } = await db.from('bgc_app_state').upsert({
            id: 1,
            payload: p,
            updated_at: new Date().toISOString()
        });
        
        if (saveError) throw saveError;
        
        $('reportForm').reset();$('date').value = new Date().toISOString().slice(0, 10);
        loadAssetsDropdown();
        msg.style.color = 'green';
        msg.textContent = 'تم تسجيل البلاغ بنجاح. رقم البلاغ: ' + ticket.ticket_no + ' — سيظهر في لوحة التحكم.';
    } catch (err) {
        console.error(err);
        msg.style.color = '#b00020';
        msg.textContent = 'لم يتم حفظ البلاغ: ' + err.message;
    } finally {
        btn.disabled = false;
    }
});
</script></body></html>
