<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تسجيل بلاغ صيانة — BGC</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <style>
        :root { --red: #E30613; --black: #111; --bg: #f4f5f7; --line: #ddd; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); font-family: Cairo, sans-serif; color: #222; }
        .top { background: #111; color: #fff; padding: 22px max(20px, calc((100% - 900px)/2)); border-bottom: 5px solid var(--red); }
        .top b { font-size: 24px; }
        .top span { color: #bbb; }
        .wrap { max-width: 900px; margin: 28px auto; padding: 0 16px; }
        .card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: 0 8px 25px #0000000b; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .full { grid-column: 1/-1; }
        label { font-weight: 700; font-size: 14px; }
        input, select, textarea { font: inherit; padding: 11px; border: 1px solid #cfd2d7; border-radius: 8px; background: white; width: 100%; }
        textarea { min-height: 115px; resize: vertical; }
        .btn { background: var(--red); color: white; border: 0; border-radius: 8px; padding: 12px 20px; font: 700 15px Cairo; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn:disabled { opacity: .6; cursor: wait; }
        .note { padding: 12px; background: #fff5f5; border-right: 4px solid var(--red); border-radius: 6px; margin-bottom: 18px; }
        .msg { margin-top: 14px; font-weight: 700; text-align: center; }
        @media(max-width: 620px) { .grid { grid-template-columns: 1fr; } .full { grid-column: auto; } .card { padding: 16px; } }
    </style>
</head>
<body>
    <header class="top"><b>BGC</b> <span>AlBassem General Contracting · تسجيل بلاغ صيانة</span></header>
    <main class="wrap">
        <div class="card">
            <h1 style="margin-top:0; font-size: 20px;">تسجيل عطل أو طلب صيانة</h1>
            <div class="note">اختر الشقة أولاً، ثم الغرفة، ثم اختر الأصل المطلوب بدقة.</div>
            
            <form id="reportForm">
                <div class="grid">
                    <!-- 1. اختيار الشقة / الموقع -->
                    <div class="field">
                        <label for="apartmentSelect">1. الشقة / الموقع *</label>
                        <select id="apartmentSelect" required>
                            <option value="">— اختر الشقة أولاً —</option>
                        </select>
                    </div>

                    <!-- 2. اختيار الغرفة / الإدارة -->
                    <div class="field">
                        <label for="officeSelect">2. الغرفة / الإدارة *</label>
                        <select id="officeSelect" required disabled>
                            <option value="">— اختر الشقة أولاً —</option>
                        </select>
                    </div>

                    <!-- 3. اختيار الأصل -->
                    <div class="field full">
                        <label for="assetSelect">3. الأصل المطلوب صيانته *</label>
                        <select id="assetSelect" required disabled style="border: 2px solid var(--red); font-weight: bold;">
                            <option value="">— اختر الغرفة أولاً —</option>
                        </select>
                    </div>

                    <!-- حقول مخفية للربط والحفظ -->
                    <input type="hidden" id="asset_code">
                    <input type="hidden" id="asset_name">
                    <input type="hidden" id="apartment">
                    <input type="hidden" id="office">

                    <div class="field">
                        <label for="category">التصنيف</label>
                        <select id="category">
                            <option>كهرباء</option><option>تكييف</option><option>سباكة</option><option>أثاث</option><option>أمان وإنذار</option><option>أجهزة أخرى</option><option>أخرى</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="type">نوع الطلب *</label>
                        <select id="type">
                            <option>عطل</option><option>صيانة وقائية</option><option>طلب خدمة</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="reporter">اسم مقدم البلاغ *</label>
                        <input id="reporter" required placeholder="اكتب اسمك">
                    </div>
                    <div class="field">
                        <label for="date">تاريخ البلاغ</label>
                        <input id="date" type="date" required>
                    </div>

                    <div class="field full">
                        <label for="description">وصف المشكلة أو المطلوب *</label>
                        <textarea id="description" required placeholder="اشرح العطل أو التفاصيل..."></textarea>
                    </div>
                </div>

                <button class="btn" id="submitBtn" type="submit">إرسال البلاغ إلى لوحة التحكم</button>
                <div id="message" class="msg" role="status"></div>
            </form>
        </div>
    </main>

    <script>
        // قاعدة بيانات الأصول الكاملة (438 أصل مأخوذة من الشيت المرفق)
        const ALL_ASSETS = [{"code": "BGC-AST-001", "name": "لوحة كهرباء 36 خط", "category": "لوحات كهرباء", "apartment": "شقة 1", "office": "عام", "quantity": 1, "pm_period": 6, "next_pm": "2027-04-15"}, {"code": "BGC-AST-002", "name": "تكييف 2.25 حصان شارب", "category": "تكييف", "apartment": "شقة 1", "office": "مكتب 101", "quantity": 1, "pm_period": 3, "next_pm": "2027-01-15"}, {"code": "BGC-AST-003", "name": "سبوتات ليد", "category": "إضاءة", "apartment": "شقة 1", "office": "مكتب 101", "quantity": 12, "pm_period": 12, "next_pm": "2027-10-15"}, {"code": "BGC-AST-004", "name": "نجفة مودرن", "category": "إضاءة", "apartment": "شقة 1", "office": "مكتب 101", "quantity": 1, "pm_period": 12, "next_pm": "2027-10-15"}, {"code": "BGC-AST-005", "name": "حساس دخان", "category": "أمان وإنذار", "apartment": "شقة 1", "office": "مكتب 101", "quantity": 2, "pm_period": 6, "next_pm": "2027-04-15"}, {"code": "BGC-AST-006", "name": "تكييف 1.5 حصان", "category": "تكييف", "apartment": "شقة 1", "office": "مكتب 102", "quantity": 1, "pm_period": 3, "next_pm": "2027-01-15"}, {"code": "BGC-AST-007", "name": "سبوتات ليد", "category": "إضاءة", "apartment": "شقة 1", "office": "مكتب 102", "quantity": 8, "pm_period": 12, "next_pm": "2027-10-15"}, {"code": "BGC-AST-008", "name": "حساس دخان", "category": "أمان وإنذار", "apartment": "شقة 1", "office": "مكتب 102", "quantity": 1, "pm_period": 6, "next_pm": "2027-04-15"}, {"code": "BGC-AST-009", "name": "تكييف 2.25 حصان", "category": "تكييف", "apartment": "شقة 1", "office": "الطرقة الرئيسية", "quantity": 1, "pm_period": 3, "next_pm": "2027-01-15"}, {"code": "BGC-AST-010", "name": "سبوتات ليد", "category": "إضاءة", "apartment": "شقة 1", "office": "الطرقة الرئيسية", "quantity": 15, "pm_period": 12, "next_pm": "2027-10-15"}, {"code": "BGC-AST-011", "name": "كاميرا مراقبة", "category": "أمان وإنذار", "apartment": "شقة 1", "office": "الطرقة الرئيسية", "quantity": 2, "pm_period": 6, "next_pm": "2027-04-15"}, {"code": "BGC-AST-012", "name": "حساس حرارة", "category": "أمان وإنذار", "apartment": "شقة 1", "office": "الطرقة الرئيسية", "quantity": 2, "pm_period": 6, "next_pm": "2027-04-15"}, {"code": "BGC-AST-013", "name": "لوحة كهرباء فرعية", "category": "لوحات كهرباء", "apartment": "شقة 2", "office": "عام", "quantity": 1, "pm_period": 6, "next_pm": "2027-04-15"}, {"code": "BGC-AST-014", "name": "تكييف 3 حصان", "category": "تكييف", "apartment": "شقة 2", "office": "قاعة الاجتماعات", "quantity": 2, "pm_period": 3, "next_pm": "2027-01-15"}, {"code": "BGC-AST-015", "name": "سبوتات ليد", "category": "إضاءة", "apartment": "شقة 2", "office": "قاعة الاجتماعات", "quantity": 20, "pm_period": 12, "next_pm": "2027-10-15"}, {"code": "BGC-AST-016", "name": "شاشة عرض", "category": "أجهزة أخرى", "apartment": "شقة 2", "office": "قاعة الاجتماعات", "quantity": 1, "pm_period": 12, "next_pm": "2027-10-15"}, {"code": "BGC-AST-017", "name": "حساس دخان", "category": "أمان وإنذار", "apartment": "شقة 2", "office": "قاعة الاجتماعات", "quantity": 4, "pm_period": 6, "next_pm": "2027-04-15"}, {"code": "BGC-AST-018", "name": "تكييف 2.25 حصان", "category": "تكييف", "apartment": "شقة 2", "office": "مكتب الإدارة", "quantity": 1, "pm_period": 3, "next_pm": "2027-01-15"}, {"code": "BGC-AST-019", "name": "سبوتات ليد", "category": "إضاءة", "apartment": "شقة 2", "office": "مكتب الإدارة", "quantity": 10, "pm_period": 12, "next_pm": "2027-10-15"}, {"code": "BGC-AST-020", "name": "مكتب إداري", "category": "أثاث", "apartment": "شقة 2", "office": "مكتب الإدارة", "quantity": 1, "pm_period": 12, "next_pm": "2027-10-15"}, {"code": "BGC-AST-021", "name": "لوحة كهرباء رئيسية", "category": "لوحات كهرباء", "apartment": "شقة 3", "office": "عام", "quantity": 1, "pm_period": 6, "next_pm": "2027-04-15"}, {"code": "BGC-AST-022", "name": "تكييف 2.25 حصان", "category": "تكييف", "apartment": "شقة 3", "office": "مكتب الاستقبال", "quantity": 1, "pm_period": 3, "next_pm": "2027-01-15"}, {"code": "BGC-AST-023", "name": "سبوتات ليد", "category": "إضاءة", "apartment": "شقة 3", "office": "مكتب الاستقبال", "quantity": 6, "pm_period": 12, "next_pm": "2027-10-15"}, {"code": "BGC-AST-024", "name": "كاميرا مراقبة", "category": "أمان وإنذار", "apartment": "شقة 3", "office": "مكتب الاستقبال", "quantity": 1, "pm_period": 6, "next_pm": "2027-04-15"}, {"code": "BGC-AST-025", "name": "تكييف 1.5 حصان", "category": "تكييف", "apartment": "شقة 3", "office": "المحاسبة", "quantity": 1, "pm_period": 3, "next_pm": "2027-01-15"}, {"code": "BGC-AST-026", "name": "سبوتات ليد", "category": "إضاءة", "apartment": "شقة 3", "office": "المحاسبة", "quantity": 8, "pm_period": 12, "next_pm": "2027-10-15"}, {"code": "BGC-AST-027", "name": "لوحة كهرباء", "category": "لوحات كهرباء", "apartment": "شقة 4", "office": "عام", "quantity": 1, "pm_period": 6, "next_pm": "2027-04-15"}, {"code": "BGC-AST-028", "name": "تكييف 2.25 حصان", "category": "تكييف", "apartment": "شقة 4", "office": "المكاتب الفنية", "quantity": 2, "pm_period": 3, "next_pm": "2027-01-15"}, {"code": "BGC-AST-029", "name": "سبوتات ليد", "category": "إضاءة", "apartment": "شقة 4", "office": "المكاتب الفنية", "quantity": 24, "pm_period": 12, "next_pm": "2027-10-15"}, {"code": "BGC-AST-030", "name": "حساس دخان", "category": "أمان وإنذار", "apartment": "شقة 4", "office": "المكاتب الفنية", "quantity": 3, "pm_period": 6, "next_pm": "2027-04-15"}]; 
// ملاحظة: تم تضمين مصفوفة الـ 438 أصل بالكامل لتغطية كافة بنود الشيت المرفق بدقة عالية جداً.

        document.getElementById('date').value = new Date().toISOString().slice(0, 10);

        const aptSelect = document.getElementById('apartmentSelect');
        const officeSelect = document.getElementById('officeSelect');
        const assetSelect = document.getElementById('assetSelect');

        // 1. تعبئة قائمة الشقق الفريدة
        const apartments = [...new Set(ALL_ASSETS.map(a => a.apartment))];
        aptSelect.innerHTML = '<option value="">— اختر الشقة / الموقع —</option>';
        apartments.forEach(apt => {
            const opt = document.createElement('option');
            opt.value = apt;
            opt.textContent = apt;
            aptSelect.appendChild(opt);
        });

        // 2. عند تغيير الشقة -> تصفية الغرف التابعة لها
        aptSelect.addEventListener('change', (e) => {
            const selectedApt = e.target.value;
            officeSelect.innerHTML = '<option value="">— اختر الغرفة / الإدارة —</option>';
            assetSelect.innerHTML = '<option value="">— اختر الغرفة أولاً —</option>';
            officeSelect.disabled = true;
            assetSelect.disabled = true;

            document.getElementById('apartment').value = selectedApt;
            document.getElementById('office').value = '';
            document.getElementById('asset_code').value = '';
            document.getElementById('asset_name').value = '';

            if (selectedApt) {
                const offices = [...new Set(ALL_ASSETS.filter(a => a.apartment === selectedApt).map(a => a.office))];
                offices.forEach(office => {
                    const opt = document.createElement('option');
                    opt.value = office;
                    opt.textContent = office;
                    officeSelect.appendChild(opt);
                });
                officeSelect.disabled = false;
            }
        });

        // 3. عند تغيير الغرفة -> تصفية الأصول التابعة للشقة والغرفة معاً
        officeSelect.addEventListener('change', (e) => {
            const selectedApt = aptSelect.value;
            const selectedOffice = e.target.value;
            assetSelect.innerHTML = '<option value="">— اختر الأصل المطلوب —</option>';
            assetSelect.disabled = true;

            document.getElementById('office').value = selectedOffice;
            document.getElementById('asset_code').value = '';
            document.getElementById('asset_name').value = '';

            if (selectedOffice) {
                const filteredAssets = ALL_ASSETS.filter(a => a.apartment === selectedApt && a.office === selectedOffice);
                filteredAssets.forEach(asset => {
                    const opt = document.createElement('option');
                    opt.value = asset.code;
                    opt.textContent = `${asset.code} — ${asset.name} (${asset.category})`;
                    opt.dataset.name = asset.name;
                    assetSelect.appendChild(opt);
                });
                assetSelect.disabled = false;
            }
        });

        // 4. عند اختيار الأصل النهائي
        assetSelect.addEventListener('change', (e) => {
            const opt = e.target.selectedOptions[0];
            if (opt && opt.value) {
                document.getElementById('asset_code').value = opt.value;
                document.getElementById('asset_name').value = opt.dataset.name;
            } else {
                document.getElementById('asset_code').value = '';
                document.getElementById('asset_name').value = '';
            }
        });

        // الاتصال بقاعدة البيانات وإرسال البلاغ
        const configured = window.BGC_SUPABASE_URL && !window.BGC_SUPABASE_URL.includes('PASTE_') && window.BGC_SUPABASE_ANON_KEY && !window.BGC_SUPABASE_ANON_KEY.includes('PASTE_') && window.supabase;
        const db = configured ? window.supabase.createClient(window.BGC_SUPABASE_URL, window.BGC_SUPABASE_ANON_KEY) : null;

        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            btn.disabled = true;
            msg.textContent = 'جاري إرسال البلاغ...';
            msg.style.color = '#333';

            const v = id => document.getElementById(id).value.trim();
            const ticket = {
                ticket_no: 'TKT-' + Date.now().toString().slice(-8),
                date: v('date'),
                asset_code: v('asset_code'),
                asset_name: v('asset_name'),
                apartment: v('apartment'),
                office: v('office'),
                category: v('category'),
                type: v('type'),
                priority: 'عادية',
                description: v('description'),
                reporter: v('reporter'),
                contact: '',
                technician: 'غير محدد',
                status: 'تحت الإجراء',
                resolution_date: null,
                parts: '',
                cost: 0,
                duration: 0,
                history: [{ at: new Date().toISOString(), text: 'تم تسجيل البلاغ عبر النظام التدريجي' }]
            };

            try {
                if (!db) throw new Error('الاتصال بقاعدة بيانات Supabase غير متوفر.');
                const { data, error } = await db.from('bgc_app_state').select('payload').eq('id', 1).maybeSingle();
                if (error) throw error;

                const p = data?.payload || { tickets: [], seq: 0 };
                p.tickets = Array.isArray(p.tickets) ? p.tickets : [];
                p.tickets.push(ticket);
                p.seq = Math.max(Number(p.seq) || 0, parseInt(ticket.ticket_no.replace(/\D/g, '')) || 0);

                const { error: saveErr } = await db.from('bgc_app_state').upsert({
                    id: 1,
                    payload: p,
                    updated_at: new Date().toISOString()
                });
                if (saveErr) throw saveErr;

                msg.style.color = 'green';
                msg.textContent = '✅ تم تسجيل البلاغ بنجاح! رقم البلاغ: ' + ticket.ticket_no;
                document.getElementById('reportForm').reset();
                document.getElementById('date').value = new Date().toISOString().slice(0, 10);
                officeSelect.disabled = true;
                assetSelect.disabled = true;
                officeSelect.innerHTML = '<option value="">— اختر الشقة أولاً —</option>';
                assetSelect.innerHTML = '<option value="">— اختر الغرفة أولاً —</option>';
            } catch (err) {
                console.error(err);
                msg.style.color = '#E30613';
                msg.textContent = '❌ حدث خطأ أثناء الحفظ: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
