<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل بلاغ — BGC</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script>
<style>:root{--red:#E30613;--black:#111;--bg:#f4f5f7;--line:#ddd}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo,sans-serif;color:#222}.top{background:#111;color:#fff;padding:22px max(20px,calc((100% - 900px)/2));border-bottom:5px solid var(--red)}.top b{font-size:24px}.top span{color:#bbb}.wrap{max-width:900px;margin:28px auto;padding:0 16px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 8px 25px #0000000b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-weight:700;font-size:14px}input,select,textarea{font:inherit;padding:11px;border:1px solid #cfd2d7;border-radius:8px;background:white;width:100%}textarea{min-height:115px;resize:vertical}.btn{background:var(--red);color:white;border:0;border-radius:8px;padding:12px 20px;font:700 15px Cairo;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.note{padding:12px;background:#fff5f5;border-right:4px solid var(--red);border-radius:6px;margin-bottom:18px}.msg{margin-top:14px;font-weight:700}.small{color:#666;font-size:13px}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:16px}}</style></head>
<body><header class="top"><b>BGC</b> <span>AlBassem General Contracting · تسجيل بلاغ</span></header><main class="wrap"><div class="card"><h1 style="margin-top:0">تسجيل عطل أو طلب صيانة</h1><div class="note">بعد إرسال البلاغ بنجاح، سيظهر في لوحة التحكم الرئيسية عند إعداد قاعدة البيانات المشتركة.</div>
<form id="reportForm"><div class="grid">
<div class="field"><label for="asset_code">كود الأصل (اختياري)</label><input id="asset_code" placeholder="مثال: BGC-AST-001"></div>
<div class="field"><label for="asset_name">اسم الأصل / البند *</label><input id="asset_name" required placeholder="مثال: تكييف مكتب الإدارة"></div>
<div class="field"><label for="apartment">المبنى / الموقع *</label><input id="apartment" required placeholder="الموقع أو الشقة"></div>
<div class="field"><label for="office">الغرفة / الإدارة</label><input id="office" placeholder="مكان الأصل"></div>
<div class="field"><label for="category">التصنيف</label><select id="category"><option>كهرباء</option><option>تكييف</option><option>سباكة</option><option>أثاث</option><option>أمان وإنذار</option><option>أجهزة أخرى</option><option>أخرى</option></select></div>
<div class="field"><label for="type">نوع الطلب *</label><select id="type"><option>عطل</option><option>صيانة وقائية</option><option>طلب خدمة</option></select></div>
<div class="field"><label for="priority">الأولوية</label><select id="priority"><option>عادية</option><option>متوسطة</option><option>عالية</option><option>حرجة</option></select></div>
<div class="field"><label for="reporter">اسم مقدم البلاغ *</label><input id="reporter" required></div>
<div class="field"><label for="contact">رقم التواصل (اختياري)</label><input id="contact" type="tel"></div>
<div class="field"><label for="date">تاريخ البلاغ</label><input id="date" type="date" required></div>
<div class="field full"><label for="description">وصف المشكلة أو المطلوب *</label><textarea id="description" required placeholder="اشرح العطل ومكانه وأي تفاصيل تساعد فريق الصيانة"></textarea></div>
</div><p class="small">لا تضع بيانات شخصية حساسة أو كلمات مرور في وصف البلاغ.</p><button class="btn" id="submitBtn" type="submit">إرسال البلاغ</button><div id="message" class="msg" role="status"></div></form>
<p style="margin-bottom:0"><a href="./index.html">العودة إلى لوحة التحكم</a></p></div></main>
<script>
const $=id=>document.getElementById(id); $('date').value=new Date().toISOString().slice(0,10);
const configured=window.BGC_SUPABASE_URL&&!window.BGC_SUPABASE_URL.includes('PASTE_')&&window.BGC_SUPABASE_ANON_KEY&&!window.BGC_SUPABASE_ANON_KEY.includes('PASTE_')&&window.supabase;
const db=configured?window.supabase.createClient(window.BGC_SUPABASE_URL,window.BGC_SUPABASE_ANON_KEY):null;
$('reportForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submitBtn'),msg=$('message');btn.disabled=true;msg.textContent='';
const v=id=>$(id).value.trim();const code=v('asset_code')||('NEW-'+Date.now());const ticket={ticket_no:'TKT-'+Date.now().toString().slice(-8),date:v('date'),asset_code:code,asset_name:v('asset_name'),apartment:v('apartment'),office:v('office'),category:v('category'),type:v('type'),priority:v('priority'),description:v('description'),reporter:v('reporter'),contact:v('contact'),technician:'غير محدد',status:'جديد',resolution_date:null,parts:'',cost:0,duration:0,history:[{at:new Date().toISOString(),text:'تم تسجيل البلاغ من صفحة البلاغات المستقلة'}]};
try{if(!db)throw new Error('لم يتم إعداد الاتصال بقاعدة البيانات بعد.');const {data,error}=await db.from('bgc_app_state').select('payload').eq('id',1).maybeSingle();if(error)throw error;const p=data?.payload||{tickets:[],seq:0,customAssets:[]};p.tickets=Array.isArray(p.tickets)?p.tickets:[];p.tickets.push(ticket);p.seq=Math.max(Number(p.seq)||0,parseInt(ticket.ticket_no.replace(/\D/g,''))||0);const {error:saveError}=await db.from('bgc_app_state').upsert({id:1,payload:p,updated_at:new Date().toISOString()});if(saveError)throw saveError;$('reportForm').reset();$('date').value=new Date().toISOString().slice(0,10);msg.style.color='green';msg.textContent='تم تسجيل البلاغ بنجاح. رقم البلاغ: '+ticket.ticket_no+' — سيظهر في لوحة التحكم.';}catch(err){console.error(err);msg.style.color='#b00020';msg.textContent='لم يتم حفظ البلاغ. تأكد من إعداد قاعدة البيانات وسياسات الوصول، ثم حاول مجددًا.';}finally{btn.disabled=false;}});
</script></body></html>
