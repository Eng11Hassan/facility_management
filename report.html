<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء بلاغ صيانة - إدارة المرافق</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-6 md:p-8">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation text-red-500"></i> تسجيل بلاغ صيانة جديد
                </h1>
                <p class="text-sm text-slate-400 mt-1">اختر الشقة ثم الغرفة لتحديد الأصل بدقة</p>
            </div>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg transition">
                <i class="fa-solid fa-arrow-right ml-1"></i> العودة للرئيسية
            </a>
        </div>

        <form id="reportForm" class="space-y-5">
            <!-- Dropdown 1: الشقة / النطاق -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">1. اختر الشقة / الوحدة</label>
                <select id="apartmentSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 transition" required>
                    <option value="">-- اختر الشقة أولاً --</option>
                </select>
            </div>

            <!-- Dropdown 2: الغرفة / الموقع الفرعي -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">2. اختر الغرفة / الموقع</label>
                <select id="roomSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 transition" disabled required>
                    <option value="">-- اختر الشقة أولاً لتحديد الغرفة --</option>
                </select>
            </div>

            <!-- Dropdown 3: الأصل -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">3. اختر الأصل المطلوب صيانتة</label>
                <select id="assetSelect" name="asset_id" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 transition" disabled required>
                    <option value="">-- اختر الغرفة أولاً لتحديد الأصل --</option>
                </select>
            </div>

            <!-- وصف المشكلة -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">وصف المشكلة / ملاحظات الصيانة</label>
                <textarea id="issueDescription" rows="4" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 transition" placeholder="اكتب تفاصيل العطل أو الصيانة المطلوبة هنا..." required></textarea>
            </div>

            <!-- زر الإرسال -->
            <button type="submit" id="submitBtn" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-red-900/20 flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> إرسال البلاغ
            </button>
        </form>
    </div>

    <!-- Script منطق جلب الأصول وتحديث الـ Dropdowns -->
    <script>
        // إعدادات اتصال Supabase (تأكد من مطابقتها لمشروعك أو جلبها من ملف الإعدادات المشترك)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allAssets = [];

        const apartmentSelect = document.getElementById('apartmentSelect');
        const roomSelect = document.getElementById('roomSelect');
        const assetSelect = document.getElementById('assetSelect');
        const reportForm = document.getElementById('reportForm');

        // جلب الأصول من جدول Supabase عند التحميل
        async function fetchAssets() {
            try {
                const { data, error } = await supabaseClient
                    .from('assets')
                    .select('*');
                
                if (error) throw error;
                allAssets = data || [];
                
                populateApartments();
            } catch (err) {
                console.error('خطأ في جلب الأصول:', err.message);
                alert('فشل تحميل قائمة الأصول من قاعدة البيانات.');
            }
        }

        // تعبئة قائمة الشقق الفريدة (مثلاً اعتماداً على حقل location أو apartment في الجدول)
        function populateApartments() {
            // افترضنا أن حقل الشقة مسجل بأسم apartment أو location في جدول الأصول
            // يمكنك تعديل المفتاح بناءً على شكل أعمدة الإكسيل اللي رفعتها
            const apartments = [...new Set(allAssets.map(item => item.apartment || item.location))].filter(Boolean);
            
            apartmentSelect.innerHTML = '<option value="">-- اختر الشقة --</option>';
            apartments.forEach(apt => {
                const opt = document.createElement('option');
                opt.value = apt;
                opt.textContent = apt;
                apartmentSelect.appendChild(opt);
            });
        }

        // عند تغيير الشقة
        apartmentSelect.addEventListener('change', (e) => {
            const selectedApt = e.target.value;
            
            // إعادة ضبط الغرف والأصول
            roomSelect.innerHTML = '<option value="">-- اختر الغرفة --</option>';
            assetSelect.innerHTML = '<option value="">-- اختر الأصل --</option>';
            roomSelect.disabled = true;
            assetSelect.disabled = true;

            if (!selectedApt) return;

            // تصفية الغرف التابعة للشقة المختارة
            const filteredRooms = [...new Set(
                allAssets
                    .filter(item => (item.apartment || item.location) === selectedApt)
                    .map(item => item.room || item.sub_location)
            )].filter(Boolean);

            filteredRooms.forEach(room => {
                const opt = document.createElement('option');
                opt.value = room;
                opt.textContent = room;
                roomSelect.appendChild(opt);
            });

            roomSelect.disabled = false;
        });

        // عند تغيير الغرفة
        roomSelect.addEventListener('change', (e) => {
            const selectedApt = apartmentSelect.value;
            const selectedRoom = e.target.value;

            assetSelect.innerHTML = '<option value="">-- اختر الأصل --</option>';
            assetSelect.disabled = true;

            if (!selectedRoom) return;

            // تصفية الأصول التابعة للشقة وغرفتها
            const filteredAssets = allAssets.filter(item => 
                (item.apartment || item.location) === selectedApt && 
                (item.room || item.sub_location) === selectedRoom
            );

            filteredAssets.forEach(asset => {
                const opt = document.createElement('option');
                opt.value = asset.id || asset.asset_code; // معرف الأصل أو كوده
                opt.textContent = `${asset.asset_name} (${asset.asset_code || 'بدون كود'})`;
                assetSelect.appendChild(opt);
            });

            assetSelect.disabled = false;
        });

        // إرسال البلاغ لقاعدة البيانات
        reportForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإرسال...';

            const reportData = {
                apartment: apartmentSelect.value,
                room: roomSelect.value,
                asset_id: assetSelect.value,
                description: document.getElementById('issueDescription').value,
                status: 'Pending',
                created_at: new Date()
            };

            try {
                // افترضنا جدول التذاكر والبلاغات اسمه maintenance_tickets
                const { error } = await supabaseClient
                    .from('maintenance_tickets')
                    .insert([reportData]);

                if (error) throw error;

                alert('تم تسجيل البلاغ بنجاح!');
                reportForm.reset();
                roomSelect.disabled = true;
                assetSelect.disabled = true;
                roomSelect.innerHTML = '<option value="">-- اختر الشقة أولاً لتحديد الغرفة --</option>';
                assetSelect.innerHTML = '<option value="">-- اختر الغرفة أولاً لتحديد الأصل --</option>';
            } catch (err) {
                console.error('خطأ في حفظ البلاغ:', err.message);
                alert('حدث خطأ أثناء حفظ البلاغ، حاول مرة أخرى.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> إرسال البلاغ';
            }
        });

        // تشغيل الجلب عند فتح الصفحة
        fetchAssets();
    </script>
</body>
</html>
