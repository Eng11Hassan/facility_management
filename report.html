<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>نظام بلاغات BGC - النسخة المباشرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <style>
        :root { --red: #E30613; --bg: #f4f5f7; }
        body { margin: 0; background: var(--bg); font-family: Cairo, sans-serif; color: #222; }
        .top { background: #111; color: #fff; padding: 20px; border-bottom: 5px solid var(--red); font-size: 20px; font-weight: bold; }
        .wrap { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full { grid-column: 1 / -1; }
        label { font-weight: 700; font-size: 14px; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 14px; }
        textarea { height: 100px; }
        .btn { background: var(--red); color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; margin-top: 15px; }
        .msg { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="top">BGC — تسجيل بلاغ صيانة مباشر</div>
    <div class="wrap">
        <div class="card">
            <form id="directForm">
                <div class="grid">
                    <div class="full">
                        <label>اختر الأصل من القائمة *</label>
                        <select id="assetDropdown" required style="font-size: 15px; font-weight: bold; background: #fffdfd; border: 2px solid #E30613;">
                            <option value="">-- جاري تحميل الأصول المعتمدة --</option>
                        </select>
                    </div>

                    <!-- حقول مخفية للترحيل -->
                    <input type="hidden" id="asset_code">
                    <input type="hidden" id="asset_name">

                    <div>
                        <label>المبنى / الموقع *</label>
                        <input type="text" id="apartment" required readonly style="background: #f9f9f9;">
                    </div>
                    <div>
                        <label>الغرفة / الإدارة *</label>
                        <input type="text" id="office" required readonly style="background: #f9f9f9;">
                    </div>

                    <div>
                        <label>التصنيف</label>
                        <select id="category"><option>كهرباء</option><option>تكييف</option><option>سباكة</option><option>أثاث</option><option>أمان وإنذار</option><option>أجهزة أخرى</option><option>أخرى</option></select>
                    </div>
                    <div>
                        <label>نوع الطلب *</label>
                        <select id="type"><option>عطل</option><option>صيانة وقائية</option><option>طلب خدمة</option></select>
                    </div>

                    <div>
                        <label>اسم مقدم البلاغ *</label>
                        <input type="text" id="reporter" required placeholder="اكتب اسمك">
                    </div>
                    <div>
                        <label>تاريخ البلاغ</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="full">
                        <label>وصف المشكلة بالتفصيل *</label>
                        <textarea id="description" required placeholder="اكتب وصف العطل..."></textarea>
                    </div>

                    <div class="full">
                        <button type="submit" class="btn" id="submitBtn">إرسال البلاغ إلى لوحة التحكم</button>
                    </div>
                </div>
            </form>
            <div id="msg" class="msg"></div>
        </div>
    </div>

, {"code": "BGC-AST-138", "apartment": "الطرقات المشتركة", "office": "طرقة أمام شقة 1 و 2", "category": "إضاءة", "name": "ليد لوجو BGC"}, {"code": "BGC-AST-139", "apartment": "الطرقات المشتركة", "office": "طرقة أمام شقة 1 و 2", "category": "أمان وإنذار", "name": "كاميرا"}, {"code": "BGC-AST-140", "apartment": "الطرقات المشتركة", "office": "طرقة أمام شقة 3 و 4", "category": "إضاءة", "name": "سبوتات"}, {"code": "BGC-AST-141", "apartment": "الطرقات المشتركة", "office": "طرقة أمام شقة 3 و 4", "category": "إضاءة", "name": "ماجنتيك ليد"}, {"code": "BGC-AST-142", "apartment": "الطرقات المشتركة", "office": "طرقة أمام شقة 4", "category": "أمان وإنذار", "name": "كاميرا"}];

document.getElementById('date').value = new Date().toISOString().slice(0, 10);

const select = document.getElementById('assetDropdown');
select.innerHTML = '<option value="">— برجاء اختيار الأصل المطلوب للصيانة —</option>';

ALL_ASSETS.forEach(asset => {
    const opt = document.createElement('option');
    opt.value = asset.code;
    // التنسيق المطلوب تماماً: الكود — الموقع (الغرفة) — اسم الأصل
    opt.textContent = `${asset.code} — ${asset.apartment} (${asset.office}) — ${asset.name}`;
    opt.dataset.apartment = asset.apartment;
    opt.dataset.office = asset.office;
    opt.dataset.name = asset.name;
    select.appendChild(opt);
});

select.addEventListener('change', (e) => {
    const opt = e.target.selectedOptions[0];
    if (opt && opt.value) {
        document.getElementById('asset_code').value = opt.value;
        document.getElementById('asset_name').value = opt.dataset.name;
        document.getElementById('apartment').value = opt.dataset.apartment;
        document.getElementById('office').value = opt.dataset.office;
    } else {
        document.getElementById('asset_code').value = '';
        document.getElementById('asset_name').value = '';
        document.getElementById('apartment').value = '';
        document.getElementById('office').value = '';
    }
});

// الاتصال بقاعدة البيانات وحفظ البلاغ
const configured = window.BGC_SUPABASE_URL && !window.BGC_SUPABASE_URL.includes('PASTE_') && window.BGC_SUPABASE_ANON_KEY && !window.BGC_SUPABASE_ANON_KEY.includes('PASTE_') && window.supabase;
const db = configured ? window.supabase.createClient(window.BGC_SUPABASE_URL, window.BGC_SUPABASE_ANON_KEY) : null;

document.getElementById('directForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    msg.textContent = 'جاري حفظ البلاغ...';
    msg.style.color = '#333';

    const v = id => document.getElementById(id).value.trim();
    const ticket = {
        ticket_no: 'TKT-' + Date.now().toString().slice(-8),
        date: v('date'),
        asset_code: v('asset_code'),
        asset_name: v('asset_name'),
        apartment: v('apartment'),
        office: v('office'),
        category: v('category'),
        type: v('type'),
        priority: 'عادية',
        description: v('description'),
        reporter: v('reporter'),
        contact: '',
        technician: 'غير محدد',
        status: 'تحت الإجراء',
        resolution_date: null,
        parts: '',
        cost: 0,
        duration: 0,
        history: [{ at: new Date().toISOString(), text: 'تم تسجيل البلاغ من النظام المباشر' }]
    };

    try {
        if (!db) throw new Error('الاتصال بقاعدة بيانات Supabase غير متوفر.');
        const { data, error } = await db.from('bgc_app_state').select('payload').eq('id', 1).maybeSingle();
        if (error) throw error;

        const p = data?.payload || { tickets: [], seq: 0 };
        p.tickets = Array.isArray(p.tickets) ? p.tickets : [];
        p.tickets.push(ticket);
        p.seq = Math.max(Number(p.seq) || 0, parseInt(ticket.ticket_no.replace(/\D/g, '')) || 0);

        const { error: saveErr } = await db.from('bgc_app_state').upsert({
            id: 1,
            payload: p,
            updated_at: new Date().toISOString()
        });
        if (saveErr) throw saveErr;

        msg.style.color = 'green';
        msg.textContent = '✅ تم تسجيل البلاغ بنجاح! رقم البلاغ: ' + ticket.ticket_no + ' (سيظهر فوراً في لوحة التحكم)';
        document.getElementById('directForm').reset();
        document.getElementById('date').value = new Date().toISOString().slice(0, 10);
        select.value = '';
    } catch (err) {
        console.error(err);
        msg.style.color = '#E30613';
        msg.textContent = '❌ حدث خطأ أثناء الحفظ: ' + err.message;
    } finally {
        btn.disabled = false;
    }
});
</script>
